# Mosquitto settings for the testbed broker (runs on the laptop).
# Start it with:  mosquitto -v -c testbed.conf
# 1883 = normal MQTT (mqtt_bridge.py on the Pi, Node-RED, ROS node)
# 9001 = MQTT over websockets (the web dashboard in the browser)
# No password: only use this on your own Wi-Fi / hotspot.
listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
