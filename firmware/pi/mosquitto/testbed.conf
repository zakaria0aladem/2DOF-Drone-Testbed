# Mosquitto settings for the testbed (copy to /etc/mosquitto/conf.d/).
# 1883 = normal MQTT (bridge, Node-RED, ROS node, phone apps)
# 9001 = MQTT over websockets (the web dashboard in the browser)
# No password: only use this on your own Wi-Fi / hotspot.
listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
